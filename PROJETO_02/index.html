<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02 - grid responsivo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Galeria responsiva</h2>
        <div class="row g-4">
            <!-- No celular: 1 por linha
             no tablet: 2 por linha
             no desktop: 3 por linha-->
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/C5DBFF/ffffff?text=foto+1" class="card/img/top" alt="foto 1">
                    </div>
                </div>
            </div>

        </div>
    </div>
</body>

</html>
